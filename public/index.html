<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المدير</title><link rel="stylesheet" href="s.css"></head><body><div class="c">
<h1>لوحة المدير</h1><a href="/display.html" target="_blank" style="color:#60a5fa">فتح الشاشة الكبيرة</a>
<div class="card"><h2>الإعدادات</h2>
عنوان الامتحان<input id="title">المدة (دقائق)<input id="duration" type="number" min="1">عدد الأسئلة في الامتحان<input id="count" type="number" min="1">درجة النجاح (%)<input id="pass" type="number" min="0" max="100">
مستوى الصوت<input id="volume" type="range" min="0" max="1" step="0.05"><button onclick="saveSet()">حفظ الإعدادات</button></div>
<div class="card"><h2>الصوت التحفيزي</h2><p id="snd"></p><input type="file" id="f" accept="audio/*"><button onclick="upSound()">رفع صوت (mp3)</button><button class="r" onclick="api('DELETE','/sound').then(load)">استخدام الصوت الافتراضي</button></div>
<div class="card"><h2>إضافة سؤال</h2><textarea id="q" placeholder="نص السؤال"></textarea>
<div id="ops"></div><button class="g" onclick="addQ()">إضافة السؤال</button><small>اختر الدائرة بجانب الإجابة الصحيحة</small></div>
<div class="card"><h2>بنك الأسئلة (<span id="cnt"></span>)</h2><div id="ql"></div></div>
<div class="card"><button class="r" onclick="if(confirm('مسح كل النتائج؟'))api('DELETE','/results').then(load)">مسح نتائج الشاشة</button></div></div>
<script>
const $=i=>document.getElementById(i);let P=sessionStorage.p||prompt('كلمة سر المدير');
$('ops').innerHTML=[0,1,2,3].map(i=>`<div style="display:flex;gap:6px;align-items:center"><input type="radio" name="c" value="${i}" style="width:auto" ${i?'':'checked'}><input id="o${i}" placeholder="الإجابة ${i+1}"></div>`).join('');
async function api(m,p,b,raw){const r=await fetch('/api/admin'+p,{method:m,headers:{'x-pass':P,...(raw?{'Content-Type':raw.type}:{'Content-Type':'application/json'})},body:raw?raw:(b?JSON.stringify(b):undefined)});
 const d=await r.json();if(r.status==401){delete sessionStorage.p;alert(d.error);location.reload()}if(d.error)alert(d.error);return d}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const d=await api('GET','/data');if(!d.settings)return;sessionStorage.p=P;
 for(const k of['title','duration','count','pass','volume'])$(k).value=d.settings[k];
 $('snd').textContent=d.settings.sound?'صوت مرفوع مفعّل':'الصوت الافتراضي مفعّل';$('cnt').textContent=d.questions.length;
 $('ql').innerHTML=d.questions.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>o?`<div class="${j==x.c?'ok':''}">${j==x.c?'✔':'•'} ${esc(o)}</div>`:'').join('')}<button class="r" onclick="api('DELETE','/question/${x.id}').then(load)">حذف</button></div>`).join('')}
async function saveSet(){await api('PUT','/settings',{title:$('title').value,duration:$('duration').value,count:$('count').value,pass:$('pass').value,volume:$('volume').value,sound:true});alert('تم الحفظ');load()}
async function addQ(){const o=[0,1,2,3].map(i=>$('o'+i).value);const c=+document.querySelector('input[name=c]:checked').value;
 const d=await api('POST','/question',{q:$('q').value,o,c});if(d.ok){$('q').value='';[0,1,2,3].forEach(i=>$('o'+i).value='');load()}}
async function upSound(){const f=$('f').files[0];if(!f)return;await api('POST','/sound',null,f.slice(0,f.size,f.type||'audio/mpeg'));load()}
load();
</script></body></html>
